{{define "initiative_edit"}}{{template "head" .}}{{template "nav" .}}<main><div class="pagehead"><div><h1>Sửa {{.Initiative.Code}}</h1><p>Chỉ sửa được khi hồ sơ còn ở trạng thái nháp.</p></div></div>{{template "error" .}}<form method="post" action="/initiatives/{{.Initiative.ID}}/edit" class="card form"><input type="hidden" name="_csrf" value="{{.User.CSRFToken}}"><label>Tên sáng kiến<input name="title" maxlength="240" required value="{{.Initiative.Title}}"></label><label>Nhóm vấn đề<select name="problem_category"><option value="">—</option>{{range .ProblemCategories}}<option value="{{.Code}}" {{if eq .Code $.Initiative.ProblemCategoryCode}}selected{{end}}>{{.Name}}</option>{{end}}</select></label><h2>Hiện trạng / vấn đề</h2><label>Tóm tắt<input name="problem_summary" maxlength="240" required value="{{.Initiative.ProblemSummary}}"></label><label>Mô tả<textarea name="problem_detail" rows="5" required>{{.Initiative.ProblemDetail}}</textarea></label><h2>Giải pháp</h2><label>Tóm tắt<input name="solution_summary" maxlength="240" required value="{{.Initiative.SolutionSummary}}"></label><label>Mô tả<textarea name="solution_detail" rows="5" required>{{.Initiative.SolutionDetail}}</textarea></label><h2>Lợi ích dự kiến</h2>{{$b := index .Benefits 0}}<div class="grid2"><label>Loại lợi ích<select name="benefit_type" required>{{range .BenefitTypes}}<option value="{{.Code}}" {{if eq .Code $b.BenefitTypeCode}}selected{{end}}>{{.Name}}</option>{{end}}</select></label><label>Trạng thái triển khai<select name="implementation_status" required>{{range .ImplementationStatuses}}<option value="{{.Code}}" {{if eq .Code $.Initiative.ImplementationStatusCode}}selected{{end}}>{{.Name}}</option>{{end}}</select></label><label>Mô tả lợi ích<textarea name="benefit_description" rows="3" required>{{$b.Description}}</textarea></label><label>Giá trị dự kiến VND<input name="expected_value_vnd" value="{{if .Initiative.ExpectedValueVND.Valid}}{{.Initiative.ExpectedValueVND.Int64}}{{end}}"></label><label>Kỳ giá trị<select name="value_period"><option value="">—</option>{{range .ValuePeriods}}<option value="{{.Code}}" {{if and $.Initiative.ValuePeriodCode.Valid (eq .Code $.Initiative.ValuePeriodCode.String)}}selected{{end}}>{{.Name}}</option>{{end}}</select></label><label>Cách tính<textarea name="calculation_method" rows="3">{{if .Initiative.ValueCalculationMethod.Valid}}{{.Initiative.ValueCalculationMethod.String}}{{end}}</textarea></label></div><div class="actions"><button>Lưu</button><a class="button secondary" href="/initiatives/{{.Initiative.ID}}">Hủy</a></div></form></main>{{template "foot" .}}{{end}}
