{{define "setup"}}{{template "head" .}}<main class="auth wide"><section class="card"><h1>Thiết lập lần đầu</h1><p>Tạo phòng ban, nhân viên và tài khoản quản trị đầu tiên.</p>{{template "error" .}}<form method="post" action="/setup" class="grid2"><label>Mã phòng ban<input name="department_code" placeholder="WH" required></label><label>Tên phòng ban<input name="department_name" placeholder="Warehouse" required></label><label>Mã nhân viên<input name="employee_no" required></label><label>Họ tên<input name="full_name" required></label><label>Tài khoản<input name="username" autocomplete="username" required></label><label>Mật khẩu ≥ 10 ký tự<input type="password" name="password" autocomplete="new-password" minlength="10" required></label><div class="span2"><button>Tạo hệ thống</button></div></form></section></main>{{template "foot" .}}{{end}}
