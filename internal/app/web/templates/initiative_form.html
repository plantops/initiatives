{{define "initiative_form"}}{{template "head" .}}{{template "nav" .}}<main><div class="pagehead"><div><h1>Sáng kiến mới</h1><p>Mã sáng kiến được tạo tự động khi lưu.</p></div></div>{{template "error" .}}<form method="post" action="/initiatives" class="card form"><input type="hidden" name="_csrf" value="{{.User.CSRFToken}}"><h2>1. Nhận diện</h2><label>Tên sáng kiến<input name="title" maxlength="240" required></label><label>Nhóm vấn đề<select name="problem_category"><option value="">—</option>{{range .ProblemCategories}}<option value="{{.Code}}">{{.Name}}</option>{{end}}</select></label><h2>2. Hiện trạng / vấn đề</h2><label>Tóm tắt<input name="problem_summary" maxlength="240" required></label><label>Mô tả hiện trạng<textarea name="problem_detail" rows="5" required></textarea></label><h2>3. Giải pháp</h2><label>Tóm tắt<input name="solution_summary" maxlength="240" required></label><label>Mô tả giải pháp<textarea name="solution_detail" rows="5" required></textarea></label><h2>4. Lợi ích dự kiến</h2><div class="grid2"><label>Loại lợi ích<select name="benefit_type" required>{{range .BenefitTypes}}<option value="{{.Code}}">{{.Name}}</option>{{end}}</select></label><label>Trạng thái triển khai<select name="implementation_status" required>{{range .ImplementationStatuses}}<option value="{{.Code}}">{{.Name}}</option>{{end}}</select></label><label>Mô tả lợi ích<textarea name="benefit_description" rows="3" required></textarea></label><label>Giá trị kinh tế dự kiến (VND)<input name="expected_value_vnd" inputmode="numeric" placeholder="40000000"></label><label>Kỳ giá trị<select name="value_period"><option value="">—</option>{{range .ValuePeriods}}<option value="{{.Code}}">{{.Name}}</option>{{end}}</select></label><label>Cách tính<textarea name="calculation_method" rows="3"></textarea></label></div><div class="actions"><button>Lưu nháp</button><a class="button secondary" href="/">Hủy</a></div></form></main>{{template "foot" .}}{{end}}
